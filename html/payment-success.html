<!-- payment-success.html -->
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Payment Successful | HOT MESS</title>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- GLOBAL CSS -->
  <link rel="stylesheet" href="../css/global.css">

  <!-- CHECKOUT CSS -->
  <link rel="stylesheet" href="../css/checkout.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>


<body class="success-page-body">

  <script src="../js/main.js"></script>
  <header class="navbar">

    <div class="logo">
      <a href="homepage-index.html">HOT MESS</a>
    </div>

    <div class="nav-icons desktop-nav">

      <a href="#product-preview">PRODUCTS</a>
      <a href="#our-mission">MISSION</a>
      <a href="#our-story">STORY</a>
      <a href="#">CONTACT</a>

      <a href="../html/ai-search.html"><img src="../images/icons/Search icon.svg" alt="search icon"></a>
      <a href="../html/cart.html">
        <div class="cart-icon-wrapper">


          <img src="../images/icons/cart icon.svg" alt="cart icon">

          <span class="cart-dot"></span>

        </div>
      </a>

    </div>
    <button class="hamburger-btn">

      <img src="../images/icons/Hamburger-btn.svg" alt="menu">

    </button>
    <div class="mobile-sidebar">

      <button class="close-sidebar">✕</button>

      <a href="../html/homepage-index.html">HOME</a>
      <a href="../html/product-large.html">LARGE SAUCE</a>
      <a href="../html/product-small.html">SMALL SAUCE</a>

      <a href="../html/ai-search.html">
        SEARCH
      </a>

      <a href="../html/cart.html">
        CART
      </a>

    </div>
  </header>



  <!-- ===================================== -->
  <!-- SUCCESS SECTION -->
  <!-- ===================================== -->

  <section class="payment-success-section">



    <div class="confetti confetti-1"></div>
    <div class="confetti confetti-2"></div>
    <div class="confetti confetti-3"></div>
    <div class="confetti confetti-4"></div>
    <div class="confetti confetti-5"></div>
    <div class="confetti confetti-6"></div>


    <div class="success-line"></div>



    <!-- 绿色check icon -->
    <div class="success-check-circle">


      <img src="../images/icons/right.svg" alt="success">

    </div>


    <div class="success-content">

      <h1>
        THANK YOU!
      </h1>

      <p class="success-subtitle">
        Your transaction was successful
      </p>




      <div class="success-info">

        <div class="info-row">
          <span>Date</span>
          <strong>04/16/2026</strong>
        </div>

        <div class="info-row">
          <span>Time</span>
          <strong>10:15 AM</strong>
        </div>

        <div class="info-row">
          <span>To</span>
          <strong>Sam Louis</strong>
        </div>

      </div>

      <div class="success-total">

        <span>Total</span>

        <strong>$58.35</strong>

      </div>


      <div class="success-divider"></div>



      <!-- 底部card -->
      <div class="payment-bottom-row">


        <div class="payment-card-box">

          <img src="../images/icons/creditcard.svg" alt="mastercard" class="mastercard-icon">


          <div class="payment-card-text">

            <h3>
              Credit Card
            </h3>

            <p>
              Mastercard **78
            </p>

          </div>

          <img src="../images/icons/SVGRepo_iconCarrier.svg" alt="barcode" class="barcode">

        </div>



        <a href="../html/homepage-index.html" class="back-home-btn">

          <img src="../images/icons/arrow-left.svg" alt="back">

          HOME

        </a>

      </div>

    </div>

  </section>





  <!-- ===================================== -->
  <!-- JS -->
  <!-- ===================================== -->

  <script>

    // 页面进入动画
    window.addEventListener("load", () => {

      document.body.classList.add("success-loaded");

    });

  </script>

</body>

</html>
